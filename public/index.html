.fxrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.wcard textarea{scrollbar-width:none;overflow-y:hidden}.wcard textarea::-webkit-scrollbar{display:none}
.cbox textarea{height:64px;min-height:0;transition:height .18s ease;scrollbar-width:none;overflow-y:hidden}.cbox textarea::-webkit-scrollbar{display:none}.cbox textarea:placeholder-shown:not(:focus){height:30px}.cbox #sc{color:#b3b3b3;transition:color .18s}.cbox:focus-within #sc,.cbox:has(textarea:not(:placeholder-shown)) #sc{color:#9a9a9a}
#view .day{border-color:transparent}
.dcard .pmk{width:150px;height:122px;z-index:-1}
/* 문답 종료 예정일 바코드 (YYYYMMDD) */
#rbar{font-family:"Libre Barcode 39",monospace;font-size:44px;line-height:1;text-align:center;color:var(--bgc);margin:12px 0 -6px;letter-spacing:0;white-space:nowrap;overflow:hidden;visibility:hidden}#rbar.ok{visibility:visible}#rbar[hidden]{display:none}
#top h1 #rtitle{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;font-weight:900;letter-spacing:-.03em}
/* Noto Sans KR 굵기 위계: 제목 900 · 질문/숫자 700 · 버튼·라벨 500 · 본문/보조 400 */
h1,#top h1 #rtitle,.mhead h1{font-weight:900;letter-spacing:-.03em}
h2,h3,.q,.wq b,.day{font-weight:700}
.tabs button{font-weight:500}.tabs button.on{font-weight:700}
.btn,label,.badge,.ans b,.nrow b,.nsub>b{font-weight:500}
.note,.wd,.day small,#rsub,#sub,.sub,.wans,.ans{font-weight:400}
/* ===== 완성안 G1–G6 레이아웃 (홈 표지 · 하단 메뉴 · 블러 헤더 · 입장권) ===== */
#roomApp{--paper:#fbf6ee;--tint:color-mix(in srgb,var(--sub) 14%,#fff);--perf:#b9ad9a;--mute2:#605856;--on:var(--homec,#fff);overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body:has(#roomApp:not([hidden])) #fb-out{display:none}
#roomApp #talk{display:none!important}
#roomApp .gbar,#roomApp .gadm{display:none}
/* 하단 메뉴 */
#roomApp #tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0 auto;max-width:640px;display:flex;flex-wrap:nowrap;gap:0;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--bgc);box-shadow:0 -6px 18px rgba(0,0,0,.2)}
#roomApp #tabs button,#roomApp #tabs button.on,#roomApp #tabs button:not(.on){flex:1 1 0;min-width:0;min-height:56px;padding:0;margin:0;border:0;border-radius:0;background:none;color:var(--on);font-size:13px;font-weight:500;letter-spacing:-.02em;opacity:.72;box-shadow:none;justify-content:center;transform:none}
#roomApp #tabs button.on{font-weight:700;opacity:1;box-shadow:inset 0 3px 0 var(--on)}
#roomApp #tabs button .tl{display:inline!important}

/* ================= 모션 레이어 (motion-prompt 참고, 2026-11-15) — 이 블록과 아래 "모션 레이어" 스크립트를 지우면 원래대로 =================
   기기에서 "움직임 줄이기"를 켜면 움직이지 않는다. 쉬운 곡선: easeOutCubic = cubic-bezier(.215,.61,.355,1), easeInOutCubic = cubic-bezier(.645,.045,.355,1) */
/* 스크롤바: 막대만 보인다. 길(트랙)은 투명해서 페이지는 배경색, 채팅 칸은 종이색이 그대로 비친다. 위아래 ▲▼ 버튼 없음 */
html{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.45) transparent}
.chat,.pk,.mbox{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,currentColor 28%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-track-piece,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(128,128,128,.7)}
.chat::-webkit-scrollbar-thumb,.pk::-webkit-scrollbar-thumb,.mbox::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,currentColor 28%,transparent)}
::-webkit-scrollbar-button{display:none;width:0;height:0}
/* 토글 스위치 (#059): 0.2초 easeOutCubic, 길 색이 회색→강조색으로 섞이며 바뀐다 */
.sw{background:#d9d7d5;transition:background-color .2s cubic-bezier(.215,.61,.355,1)}
.sw::after{box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s cubic-bezier(.215,.61,.355,1)}
.sw:active::after{width:24px}
.sw.on:active::after{transform:translateX(16px)}
/* 필터 칩 (#061): 고른 칩은 체크가 벌어지며 들어온다 (0.15초) */
.mfb.on::before{content:"✓";display:inline-block;overflow:hidden;vertical-align:top;width:13px;margin-right:4px;font-weight:700}
/* 배지 (#071): 새 채팅 점이 생기면 1.3배로 톡 튀었다 돌아오고 물결이 퍼진다 */
.rdot.pop::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;opacity:0}
/* 스피너 (#070): 불러오는 중 띠 */
#gload span{display:inline-flex;align-items:center;gap:7px}
#gload span::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-right-color:#fff;animation:mspin .77s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
/* 모달 (#049) / 바텀시트 (#051): 휴대폰에서는 아래에서 올라오고, 손잡이를 끌어내려 닫는다 */
.m-grip{display:none}
@media (max-width:560px){
  #modal{align-items:flex-end;padding:0}
  #modal .mbox{max-width:none;max-height:88vh;border-radius:18px 18px 0 0;padding-top:30px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));position:relative}
  #modal .m-grip{display:block;position:absolute;top:0;left:0;right:0;height:28px;touch-action:none;cursor:grab}
  #modal .m-grip::before{content:"";position:absolute;top:10px;left:50%;width:52px;height:6px;margin-left:-26px;border-radius:3px;background:#d4cfc9}
}
@media (prefers-reduced-motion:no-preference){
  .mfb.on::before{animation:mchip .15s cubic-bezier(.215,.61,.355,1)}
  @keyframes mchip{from{width:0;margin-right:0;opacity:0}}
  .rdot.pop{animation:mbadge .3s cubic-bezier(.215,.61,.355,1)}
  .rdot.pop::after{animation:mripple .5s cubic-bezier(.215,.61,.355,1)}
  @keyframes mbadge{from{transform:scale(1.3)}}
  @keyframes mripple{from{opacity:.5;transform:scale(1)}to{opacity:0;transform:scale(2.4)}}

  @keyframes mopen{from{opacity:0;transform:scale(.96)}}

}

   press 80ms 누름 · quick 160ms 탭·칩·호버 · base 240ms 펼치기·모달 · exit 180ms 사라짐 · moment 480ms 하루 1회 이하의 순간 */

::view-transition-old(gview),::view-transition-old(gview-h),::view-transition-old(gtop),::view-transition-old(gbar){display:none}

/* ===== 내보내기 공통: 지금 문답의 색 (배경·메인·글자 + 종이 프리셋) ===== */
function gPalNow(){const P0=PAPERS[cfg?.paper]||PAPERS.cream,p=P0.c,m=gInk(PL.main,p,!!P0.dk);
  return{...p,ink:m,bg:PL.bg,main:PL.main,text:gPaperTx(p,!!P0.dk),dk:!!P0.dk,on:gOn(PL.bg)}}
function gMixHex(a,b,t){const x=gRGB(a),y=gRGB(b);return"#"+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,"0")).join("")}
function cvBar(g,t,x,y,w,h,col){const s="*"+t+"*";let u=0;for(const ch of s){const p=C39[ch];if(!p)continue;for(let i=0;i<9;i++)u+=p[i]==="w"?3:1;u+=1}u-=1;
  const k=w/u;let cx=x;g.fillStyle=col;for(const ch of s){const p=C39[ch];if(!p)continue;for(let i=0;i<9;i++){const bw=(p[i]==="w"?3:1)*k;if(i%2===0)g.fillRect(cx,y,bw+.4,h);cx+=bw}cx+=k}}
const gHM=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const gYMD=n=>{const d=gDateObj(n);return d.getFullYear()+"년 "+String(d.getMonth()+1).padStart(2,"0")+"월 "+String(d.getDate()).padStart(2,"0")+"일"};
const gPawDay=n=>n!==today&&+pmCands(n+":hc",1).split(",")[0]<.4;
const PAWURI=(PAWCSS.match(/url\(([^)]+)\)/)||[])[1]||"";
try{document.head.insertAdjacentHTML("beforeend","<style>"+PAWCSS.replace(/^\.paw\{/,"#roomApp .dcard .gpaw{")+"#roomApp .dcard .gpaw{z-index:2;pointer-events:none}</style>")}catch(e){}
function gPawSite(){const pw=document.querySelector(".dcard .gpaw");if(!pw)return;const go=()=>{if(pw.isConnected)pawPlace(pw.parentNode,pw)};go();document.querySelectorAll(".dcard .stamps img").forEach(i=>{if(!i.complete)i.addEventListener("load",go)})}
function gPmV(n){return pmCands(n+":pb",1).split(",").map(Number)}
function gPmTop(v){return -61+70*v[1]}
function gPmStyle(n){const v=gPmV(n);return "left:calc(20% + 42%*"+v[0].toFixed(3)+" - 75px);top:"+gPmTop(v).toFixed(1)+"px;transform:rotate("+((v[2]*2-1)*12).toFixed(1)+"deg)"}
function gDateObj(n){const [y,m,d]=cfg.start.split("-").map(Number);return new Date(y,m-1,d+n-1)}

/* ===== 이미지로 내보내기: 하루 보기 입장권 그대로 · 가로 1080 고정, 답변 길이만큼 세로가 늘어나요 ===== */
async function exportPng(n){

function sfx(k,j,vol){const a=actx();if(!a||!SFX[k]||!SFX[k][j])return;const id=k+j;
 if(!SFXB[id])SFXB[id]=new Promise((ok,no)=>{const bin=Uint8Array.from(atob(SFX[k][j]),c=>c.charCodeAt(0));a.decodeAudioData(bin.buffer,ok,no)}).catch(()=>{delete SFXB[id];return null});
 SFXB[id].then(buf=>{if(!buf)return;const s=a.createBufferSource(),g=a.createGain();g.gain.value=vol||.8;s.buffer=buf;s.connect(g);g.connect(a.destination);s.start()})}
function snd(kind,i){const a=actx();if(!a||i<0)return;if(i>=4){sfx(kind,i-4,.56);return}const t=a.currentTime+.03,out=a.createGain();out.gain.value=.55;out.connect(a.destination);
  const tone=(f,s,d,ty,g,f2)=>{const o=a.createOscillator(),e=a.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t+s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+s+d);e.gain.setValueAtTime(.0001,t+s);e.gain.exponentialRampToValueAtTime(g||.4,t+s+.01);e.gain.exponentialRampToValueAtTime(.0001,t+s+d);o.connect(e);e.connect(out);o.start(t+s);o.stop(t+s+d+.05)};
  const noise=(s,d,f1,f2,g)=>{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let k=0;k<n;k++)x[k]=Math.random()*2-1;const sr=a.createBufferSource();sr.buffer=b;const bp=a.createBiquadFilter();bp.type="bandpass";bp.Q.value=2;bp.frequency.setValueAtTime(f1,t+s);bp.frequency.exponentialRampToValueAtTime(f2,t+s+d);const e=a.createGain();e.gain.setValueAtTime(g,t+s);e.gain.exponentialRampToValueAtTime(.0001,t+s+d);sr.connect(bp);bp.connect(e);e.connect(out);sr.start(t+s)};
  if(kind==="q"){
    if(i===0){[880,1175,1568,2093].forEach((f,k)=>tone(f,k*.09,.5,"sine",.35));tone(3136,.28,.4,"sine",.12)}
    else if(i===1){noise(0,.3,1200,5000,.6);tone(1318,.28,.6,"sine",.35);tone(1760,.36,.7,"sine",.3)}
    else if(i===2){[1047,1319,1568,2093,1568,1319].forEach((f,k)=>tone(f,k*.17,.9,"triangle",.3))}
    else{[[660,1],[1822,.5],[3564,.25],[1320,.4]].forEach(([f,g])=>tone(f,0,1.6,"sine",.35*g))}
  }else{
    if(i===0)tone(900,0,.12,"sine",.6,400);
    else if(i===1){tone(988,0,.25,"sine",.4);tone(1319,.11,.4,"sine",.4)}
    else if(i===2){tone(700,0,.1,"triangle",.45,1000);tone(1000,.1,.14,"triangle",.45,1600)}

<script>
/* ================= 모션 레이어 (motion-prompt 참고, 2026-11-15) — 위쪽 "모션 레이어" 스타일과 함께 지우면 원래대로 ================= */
(function(){
  var R=window.matchMedia?matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};
  var still=function(){return R.matches};
  /* 모달 (#049) / 바텀시트 (#051): 열 때 커지며(휴대폰은 올라오며) 나타나고, 닫을 때 거꾸로 사라진다 */
  if(typeof modal==="function"&&typeof closeModal==="function"){
    var openM=modal,closeM=closeModal,timer=0;
    var grip=function(m){var box=m.querySelector(".mbox");if(!box||box.querySelector(".m-grip"))return;var g=document.createElement("div");g.className="m-grip";g.setAttribute("aria-hidden","true");box.prepend(g);
      /* 손잡이를 끌어내리면 시트가 손가락을 따라 내려가고, 충분히 내리면 닫힌다 */
      var y0=0,dy=0,on=false;
      g.addEventListener("pointerdown",function(e){g._ly=e.clientY;g._lt=performance.now();g._v=0;on=true;y0=e.clientY;dy=0;g.setPointerCapture(e.pointerId);box.style.transition="none"});
      g.addEventListener("pointermove",function(e){if(!on)return;var t1=performance.now();g._v=(e.clientY-g._ly)/Math.max(1,t1-g._lt);g._ly=e.clientY;g._lt=t1;dy=Math.max(0,e.clientY-y0);box.style.transform="translateY("+dy+"px)"});
      var end=function(){if(!on)return;on=false;box.style.transition="transform .25s cubic-bezier(.215,.61,.355,1)";
        if(dy>Math.min(140,box.offsetHeight*.3)||(dy>24&&g._v>.8)){box.style.transform="translateY(100%)";setTimeout(function(){box.style.transform="";box.style.transition="";closeM()},still()?0:220)}
        else{box.style.transform="";setTimeout(function(){box.style.transition=""},260)}};
      g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end)};
    window.modal=modal=function(html,wire){clearTimeout(timer);var m=document.getElementById("modal");m.classList.remove("m-out","m-in");openM(html,wire);grip(m);
      if(!still()){void m.offsetWidth;m.classList.add("m-in")}};
    window.closeModal=closeModal=function(){var m=document.getElementById("modal");if(!m||m.hidden||still())return closeM();
      m.classList.remove("m-in");m.classList.add("m-out");clearTimeout(timer);timer=setTimeout(function(){m.classList.remove("m-out");closeM()},innerWidth<=560?220:180)};
  }
  /* 배지 (#071): 새 채팅 점이 "새로" 생길 때만 톡 튄다 (화면을 다시 그려도 이미 있던 점은 그대로) */
  var seen={},key=function(d){var p=d.parentElement||{};return (p.getAttribute&&(p.getAttribute("data-t")||p.getAttribute("data-n")||p.getAttribute("data-rid")||p.getAttribute("data-id")))||(p.className||"")+"|"+(p.textContent||"").slice(0,20)};
  var scan=function(){var now={};document.querySelectorAll(".rdot").forEach(function(d){var k=key(d);now[k]=1;if(!seen[k]){d.classList.add("pop")}});seen=now};
  try{new MutationObserver(function(){scan()}).observe(document.body,{childList:true,subtree:true});scan()}catch(e){}
  /* 눌림 도장 (리플 대신): 누르는 즉시(pointerdown) .97로 눌리고 살짝 어두워진다(80ms). 떼면 160ms에 돌아온다.
     CSS transition을 건드리지 않도록 개별 속성 scale + filter를 Web Animations로 움직여요 */
  var PRESS=".btn,.mfb,#mainApp .mnew,.sq,.gcta";document.documentElement.classList.add("gpress");
  document.addEventListener("pointerdown",function(e){if(still()||e.button>0)return;
    var b=e.target.closest&&e.target.closest(PRESS);if(!b||b.disabled||!b.animate)return;
    if(b._mp)b._mp.cancel();
    b._mp=b.animate([{scale:1,filter:"brightness(1)"},{scale:.97,filter:"brightness(.92)"}],{duration:80,easing:"ease-out",fill:"forwards"});
    var up=function(){removeEventListener("pointerup",up,true);removeEventListener("pointercancel",up,true);
      var a=b._mp;if(!a)return;b._mp=null;var back=b.animate([{scale:.97,filter:"brightness(.92)"},{scale:1,filter:"brightness(1)"}],{duration:160,easing:"cubic-bezier(.215,.61,.355,1)"});
      a.cancel();back.onfinish=function(){back.cancel()}};
    addEventListener("pointerup",up,true);addEventListener("pointercancel",up,true)},{passive:true});
})();
